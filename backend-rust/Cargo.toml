[package]
name = "paytable-api"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Minimalist Rust settlement, linked-wallet human approval gate, and PayPal Sandbox orchestrator for PayTable"

[dependencies]
anyhow = "1.0"
axum = "0.7"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
