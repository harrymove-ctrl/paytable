services:
  - type: web
    name: paytable
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 4104
      - key: PAYTABLE_API_ORIGIN
        value: http://127.0.0.1:4184
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: PAYPAL_WEBHOOK_HMAC_SECRET
        generateValue: true
